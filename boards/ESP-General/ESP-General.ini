; PlatformIO Project Configuration File
[env:esp32-s3-devkitc-1-psram]
board_build.arduino.memory_type = qio_opi  ; NEEDED FOR 8MB PSRAM (N16R8)
extends                 = env:esp32-s3-devkitc-1
build_flags =
	${env:esp32-s3-devkitc-1.build_flags}
	-D BOARD_HAS_PSRAM=1

[env:esp32-s3-devkitc-1]
board = ESP-General
board_build.partitions = custom_8Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/ESP-General>
build_flags =
	${env.build_flags}
	-Iboards/ESP-General
	-DUSB_as_HID=1
	; grove pins
	-DGROVE_SDA=8
	-DGROVE_SCL=46
	; ir led pin
	-DIR_TX_PINS='{{"M5 IR Mod", GROVE_SDA}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'
	-DIR_RX_PINS='{{"M5 IR Mod", GROVE_SCL}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'
	-DTXLED=40
	-DLED_ON=HIGH
	-DLED_OFF=LOW
	; RF433
	-DRF_TX_PINS='{{"M5 RF433T", GROVE_SDA}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'
	-DRF_RX_PINS='{{"M5 RF433R", GROVE_SCL}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'
	; sd card pins
	-DSDCARD_CS=17
	-DSDCARD_SCK=12
	-DSDCARD_MISO=11
	-DSDCARD_MOSI=13
	; tft vars
	-DROTATION=1
	-DBACKLIGHT=-1
	-DMINBRIGHT=160
	-DSMOOTH_FONT=1
	-DTFT_DISPON=0x29
	-DTFT_DISPOFF=0x28
	-DTFT_CS=10
	-DTFT_DC=9
	-DTFT_RST=-1
	-DTOUCH_CS=5
	-DTFT_MOSI=11
	-DTFT_SCLK=12
	-DTFT_BL=7
	; text sizes
	-DFP=1
	-DFM=2
	-DFG=3
	; ui buttons
	-DBTN_ALIAS='"OK"'
	; FM Radio
	-DFM_RSTPIN=12
	; CC1101
	-DUSE_CC1101_VIA_SPI
	-DCC1101_GDO0_PIN=9
	-DCC1101_SS_PIN=10
	-DCC1101_MOSI_PIN=11
	-DCC1101_SCK_PIN=12
	-DCC1101_MISO_PIN=13
	; ──────────────────────────────────────────
	; NRF24L01 — ATIVADO E PINOS CORRIGIDOS
	; Conecte: CE=GPIO7, CSN=GPIO8
	; SCK=12, MOSI=11, MISO=13 (SPI bus compartilhado)
	; ──────────────────────────────────────────
	-DUSE_NRF24_VIA_SPI
	-DNRF24_CE_PIN=7
	-DNRF24_SS_PIN=8
	-DNRF24_MOSI_PIN=11
	-DNRF24_SCK_PIN=12
	-DNRF24_MISO_PIN=13
	; SPI bus global
	-DSPI_SCK_PIN=12
	-DSPI_MOSI_PIN=11
	-DSPI_MISO_PIN=13
	-DSPI_SS_PIN=10
	-DDEVICE_NAME='"ESP32-S3 DevkitC"'
lib_deps =
	${env.lib_deps}
